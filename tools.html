<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رفيق المذاكرة - الذكاء الاصطناعي</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <div class="side"></div>
  <div class="main">
    <h1>الأدوات ومساعد الذكاء الاصطناعي</h1>
    <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:16px;flex:1;max-width:800px;width:100%;">
      <div style="font-weight:700;color:#0B5F58;">المحادثة الذكية للمساعدة في المذاكرة:</div>
      <div id="globalAiChatBox" style="flex:1;background:#F3F5F9;border-radius:12px;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;">
        <div style="background:#fff;padding:12px;border-radius:10px;max-width:80%;">أهلاً بك! اسألني عن أي موضوع دراسي أو اطلب مني نصائح لتنظيم وقتك.</div>
      </div>
      <div style="display:flex;gap:10px;">
        <input type="text" id="globalAiInput" class="inp" placeholder="اكتب رسالتك هنا...">
        <button id="globalAiSendBtn" class="btn pri">إرسال</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initSidebar } from './js/sidebar.js';
  import { esc } from './js/db.js';

  initSidebar('tools');

  const input = document.getElementById('globalAiInput');
  const box = document.getElementById('globalAiChatBox');
  document.getElementById('globalAiSendBtn').onclick = () => {
    const txt = input.value.trim();
    if (!txt) return;
    box.innerHTML += `<div style="background:#0B5F58;color:#fff;padding:10px;border-radius:10px;align-self:flex-end;max-width:80%">${esc(txt)}</div>`;
    input.value = '';
    setTimeout(() => {
      box.innerHTML += `<div style="background:#fff;padding:10px;border-radius:10px;align-self:flex-start;max-width:80%">تم استلام سؤالك! يمكنك فتح أي ملف من المكتبة والضغط على زر النجمة في الأعلى لتحليل صفحاته مباشرة.</div>`;
      box.scrollTop = box.scrollHeight;
    }, 500);
  };
</script>
</body>
</html>
