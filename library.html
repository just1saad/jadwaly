<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رفيق المذاكرة - المكتبة</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <div class="side"></div>
  <div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1>المكتبة وملفات PDF</h1>
      <button class="btn pri" data-import-pdf>استيراد PDF</button>
    </div>
    <div id="libGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:18px;overflow-y:auto;flex:1;padding:4px"></div>
  </div>
</div>

<script type="module">
  import { initSidebar } from './js/sidebar.js';
  import { storeAction, setupPdfImporter, esc } from './js/db.js';

  initSidebar('library');
  setupPdfImporter((rec) => { location.href = `study.html?id=${rec.id}`; });

  async function renderLibrary() {
    const files = await storeAction('files', 'readonly', 'getAll');
    const grid = document.getElementById('libGrid');
    if (!files.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:#566178">مكتبتك فارغة. اضغط «استيراد PDF».</div>';
      return;
    }
    grid.innerHTML = files.map(f => `
      <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:8px">
        <a href="study.html?id=${f.id}" style="aspect-ratio:3/4;border-radius:10px;background:#E4F2F0;color:#0B5F58;display:flex;align-items:center;justify-content:center;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </a>
        <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</div>
        <div style="display:flex;gap:6px;">
          <a href="study.html?id=${f.id}" class="btn pri" style="flex:1;height:32px;font-size:13px;">افتح</a>
          <button class="btn sec del-btn" data-id="${f.id}" style="height:32px;padding:0 10px;color:#B42318;">حذف</button>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.del-btn').forEach(btn => {
      btn.onclick = async () => {
        if (confirm('هل تريد حذف هذا الملف؟')) {
          await storeAction('files', 'readwrite', 'delete', btn.dataset.id);
          renderLibrary();
        }
      };
    });
  }
  renderLibrary();
</script>
</body>
</html>
