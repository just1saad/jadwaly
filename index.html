<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رفيق المذاكرة - الرئيسية</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <div class="side"></div>
  <div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><h1>أهلاً بك في رفيق المذاكرة</h1><div class="mut" style="font-size:15px;margin-top:4px">مساحتك المتكاملة لتنظيم الملاحظات، ملفات PDF، والتفريغ الصوتي الفوري</div></div>
      <button class="btn pri" data-import-pdf>استيراد PDF</button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card" style="padding:22px;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><h2>الجدول المدرسي اليومي</h2><a href="schedule.html" style="color:#0B5F58;font-weight:600;font-size:14px;text-decoration:none">إدارة الجدول</a></div>
        <div id="todayClassesList" style="flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
      </div>

      <div style="background:#14213D;color:#fff;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2>التفريغ الصوتي الفوري</h2>
          <button id="homeLiveMicBtn" class="btn pri" style="background:#E8590C;height:36px;font-size:13px;border-radius:18px">بدء الاستماع</button>
        </div>
        <div class="mut" id="homeLiveStatus" style="font-size:12px;color:#C7D0E4">اضغط بدء الاستماع وتحدث بوضوح...</div>
        <textarea id="homeLiveBox" class="inp" style="flex:1;min-height:80px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);resize:none" placeholder="كلمة بكلمة ستظهر هنا فوراً..."></textarea>
        <div style="display:flex;justify-content:flex-end">
          <button id="saveHomeLiveBtn" class="btn pri" style="height:34px;font-size:13px">حفظ في التسجيلات</button>
        </div>
      </div>
    </div>

    <h2>مكتبة ملفاتك السريعة</h2>
    <div id="homeLibPreview" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"></div>
  </div>
</div>

<script type="module">
  import { initSidebar } from './js/sidebar.js';
  import { storeAction, setupPdfImporter, makeId, esc } from './js/db.js';

  initSidebar('home');
  setupPdfImporter((rec) => { location.href = `study.html?id=${rec.id}`; });

  // عرض الملفات السريعة
  const files = await storeAction('files', 'readonly', 'getAll');
  document.getElementById('homeLibPreview').innerHTML = files.slice(0, 4).map(f => `
    <a href="study.html?id=${f.id}" class="card" style="padding:12px;text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5F58" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</div>
    </a>
  `).join('') || '<div class="mut">لا توجد ملفات حالياً.</div>';

  // عرض حصص اليوم
  const DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'];
  const s = JSON.parse(localStorage.getItem('rafeeq-school-timetable-v1') || '{"classes":[]}');
  const todayName = DAYS[new Date().getDay() === 0 || new Date().getDay() === 6 ? 0 : new Date().getDay() - 1] || 'الأحد';
  const list = s.classes.filter(c => c.day === todayName);
  document.getElementById('todayClassesList').innerHTML = list.length ? list.map(c => `<div style="padding:8px 12px;background:#F3F5F9;border-radius:8px;font-weight:600">${esc(c.title)}</div>`).join('') : '<div class="mut" style="text-align:center;padding:10px">لا توجد حصص مسجلة اليوم.</div>';

  // التفريغ الصوتي
  const startBtn = document.getElementById('homeLiveMicBtn');
  const textBox = document.getElementById('homeLiveBox');
  const statusEl = document.getElementById('homeLiveStatus');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRec) {
    let recognition = new SpeechRec();
    recognition.lang = 'ar-SA'; recognition.continuous = true; recognition.interimResults = true;
    let listening = false, finalTxt = '';

    startBtn.onclick = () => {
      if (!listening) {
        listening = true; finalTxt = textBox.value ? textBox.value + ' ' : '';
        recognition.start(); startBtn.textContent = 'إيقاف'; startBtn.style.background = '#B42318'; statusEl.textContent = 'جاري الاستماع...';
      } else {
        listening = false; recognition.stop(); startBtn.textContent = 'بدء الاستماع'; startBtn.style.background = '#E8590C'; statusEl.textContent = 'تم الإيقاف.';
      }
    };
    recognition.onresult = (e) => {
      let interim = '', curFinal = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) curFinal += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      if (curFinal) finalTxt += curFinal;
      textBox.value = finalTxt + interim;
    };
  } else {
    statusEl.textContent = 'متصفحك لا يدعم التفريغ الصوتي.'; startBtn.disabled = true;
  }

  document.getElementById('saveHomeLiveBtn').onclick = async () => {
    const text = textBox.value.trim();
    if (!text) return alert('لا يوجد نص لحفظه');
    await storeAction('recordings', 'readwrite', 'put', { id: makeId(), title: 'تفريغ ' + new Date().toLocaleDateString('ar-SA'), date: new Date().toLocaleDateString('ar-SA'), transcript: text });
    alert('تم حفظ التفريغ في صفحة التسجيلات!'); textBox.value = '';
  };
</script>
</body>
</html>
