<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>رفيق المذاكرة - Study Companion</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#F3F5F9;overflow:hidden;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#14213D}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}

.scr{position:fixed;inset:0;display:none;flex-direction:row;background:#F3F5F9;overflow:hidden;width:100vw;height:100vh}
.scr.on{display:flex}

.side{width:250px;background:#fff;border-left:1px solid #E3E7EF;padding:24px 16px;display:flex;flex-direction:column;gap:6px;flex:none;height:100%;z-index:10;overflow-y:auto}
.nav{display:flex;align-items:center;gap:12px;padding:0 14px;height:48px;border-radius:12px;border:0;background:transparent;color:#44506A;font-size:15px;width:100%;text-align:right;font-weight:600}
.nav.on{background:#E4F2F0;color:#0B5F58;font-weight:700}
.nav:hover{background:#EEF1F6}.nav.on:hover{background:#E4F2F0}

.main{flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:18px;min-width:0;height:100%;overflow-y:auto}
.card{background:#fff;border:1px solid #E3E7EF;border-radius:16px}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:0;font-size:15px;font-weight:700;justify-content:center}
.pri{background:#0B5F58;color:#fff}.sec{background:#fff;border:1px solid #D5DBE7;color:#14213D}
h1{margin:0;font-size:26px}h2{margin:0;font-size:18px}
.mut{color:#566178;font-size:13px}
.fab{width:44px;height:44px;border:0;border-radius:12px;background:#fff;color:#14213D;box-shadow:0 2px 10px rgba(20,33,61,.15);display:flex;align-items:center;justify-content:center}
.opt{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 20px;border-radius:14px;background:#fff;border:2px solid #E3E7EF;font-size:16px;font-weight:600;width:100%;text-align:right}
.opt:hover{border-color:#9bb}
.opt.ok{border-color:#0B5F58;background:#E4F2F0}.opt.no{border-color:#B42318;background:#FDECEA}
.hide{display:none!important}
.modal-bg{position:fixed;inset:0;background:rgba(20,33,61,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal-box{background:#fff;border-radius:20px;padding:24px;width:480px;max-width:100%;box-shadow:0 20px 50px rgba(20,33,61,.25);display:flex;flex-direction:column;gap:14px}
.inp{width:100%;padding:10px 14px;border:1px solid #D5DBE7;border-radius:10px;font-size:15px;color:#14213D;background:#fff}
</style>
</head>
<body>

<template id="sidebarTemplate">
  <div style="display:flex;align-items:center;gap:10px;padding:0 6px 20px">
    <div style="width:38px;height:38px;border-radius:10px;background:#0B5F58;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">ر</div>
    <b style="font-size:18px">رفيق المذاكرة</b>
  </div>
  <button class="nav" data-go="home"><span>الرئيسية</span></button>
  <button class="nav" data-go="library"><span>المكتبة وملفات PDF</span></button>
  <button class="nav" data-go="notebooks"><span>الدفاتر والملاحظات</span></button>
  <button class="nav" data-go="schedule"><span>الجدول والتخطيط</span></button>
  <button class="nav" data-go="quizzes"><span>الاختبارات والبطاقات</span></button>
  <button class="nav" data-go="recordings"><span>التسجيلات الصوتية</span></button>
  <button class="nav" data-go="tools"><span>الأدوات والذكاء الاصطناعي</span></button>
</template>

<!-- HOME -->
<div class="scr on" id="home">
 <div class="side"></div>
 <div class="main">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div><h1>أهلاً بك في رفيق المذاكرة</h1><div class="mut" style="font-size:15px;margin-top:4px">مساحتك المتكاملة لتنظيم الملاحظات وملفات PDF</div></div>
    <div style="display:flex;gap:10px"><button class="btn pri" data-import-pdf>استيراد PDF</button></div>
  </div>
  <h2>مكتبة ملفاتك السريعة</h2>
  <div id="homeLibPreview" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-height:170px;overflow:hidden"></div>
 </div>
</div>

<!-- LIBRARY -->
<div class="scr" id="library">
 <div class="side"></div>
 <div class="main">
  <div style="display:flex;justify-content:space-between;align-items:center"><h1>المكتبة وملفات PDF</h1><button class="btn pri" data-import-pdf>استيراد PDF</button></div>
  <div id="libGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:18px;overflow-y:auto;flex:1;padding:4px"></div>
 </div>
</div>

<!-- NOTEBOOKS -->
<div class="scr" id="notebooks"><div class="side"></div><div class="main"><h1>دفاتر الملاحظات</h1><div id="notebooksGrid"></div></div></div>

<!-- SCHEDULE -->
<div class="scr" id="schedule"><div class="side"></div><div class="main"><h1>الجدول</h1><div id="schedContainer"></div></div></div>

<!-- QUIZZES -->
<div class="scr" id="quizzes">
 <div class="side"></div>
 <div class="main" id="qMain"></div>
</div>

<!-- RECORDINGS -->
<div class="scr" id="recordings"><div class="side"></div><div class="main"><h1>التسجيلات</h1><div id="recList"></div></div></div>

<!-- TOOLS -->
<div class="scr" id="tools"><div class="side"></div><div class="main"><h1>الأدوات</h1></div></div>

<!-- STUDY -->
<div class="scr" id="study" style="background:#E9ECF2">
 <div class="side"></div>
 <div class="main" style="position:relative; padding:0; overflow:hidden;">
   <div dir="ltr" style="position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;padding:80px 24px 24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;" id="paper"></div>
   <div style="position:absolute;top:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:20">
     <button class="fab" data-go="library" title="رجوع">↩</button>
     <div class="card" id="pdfFileTitleBanner" style="height:44px;padding:0 14px;display:flex;align-items:center;font-size:13px;font-weight:600">لا يوجد ملف مفتوح</div>
   </div>
 </div>
</div>

<div id="modalRoot" class="modal-bg hide"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  initGlobalSidebars();
  loadLibrary();
  renderQuizHome();
});

function initGlobalSidebars(){
  const tpl = document.getElementById('sidebarTemplate');
  if(!tpl) return;
  document.querySelectorAll('.scr').forEach(scr => {
    const sideEl = scr.querySelector('.side');
    if(sideEl && !sideEl.hasChildNodes()){
      sideEl.appendChild(tpl.content.cloneNode(true));
      const sId = scr.id;
      sideEl.querySelectorAll('[data-go]').forEach(btn => {
        if(btn.dataset.go === sId) btn.classList.add('on');
      });
    }
  });
}

function makeId(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}

const DB_NAME='rafeeq-comprehensive-db', DB_VER=3;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains('files')) db.createObjectStore('files',{keyPath:'id'});
    };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}

async function storeAction(storeName,mode,action,val){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(storeName,mode);
    const st=tx.objectStore(storeName);
    const req=action==='getAll'?st.getAll():action==='delete'?st.delete(val):st.put(val);
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
    tx.oncomplete=()=>db.close();
  });
}

let pdfState={files:[],current:null,doc:null};
const pdfInput=document.createElement('input');
pdfInput.type='file'; pdfInput.accept='application/pdf,.pdf'; pdfInput.style.display='none';
document.body.appendChild(pdfInput);

document.addEventListener('click',e=>{
  if(e.target.closest('[data-import-pdf]')){e.preventDefault(); pdfInput.value=''; pdfInput.click();}
});

pdfInput.addEventListener('change',async()=>{
  const file=pdfInput.files[0];
  if(!file) return;
  const buffer=await file.arrayBuffer();
  const rec={id:makeId(),name:file.name,size:file.size,data:buffer};
  await storeAction('files','readwrite','put',rec);
  await loadLibrary();
  openPdf(rec);
});

async function loadLibrary(){
  pdfState.files=await storeAction('files','readonly','getAll');
  renderLibraryGrid();
  renderHomePreview();
}

function renderLibraryGrid(){
  const grid=document.getElementById('libGrid');
  if(!grid) return;
  if(!pdfState.files.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:50px;color:#566178">مكتبتك فارغة. اضغط «استيراد PDF».</div>';
    return;
  }
  grid.innerHTML=pdfState.files.map(f=>`
    <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:8px">
      <div style="aspect-ratio:3/4;border-radius:10px;background:#E4F2F0;color:#0B5F58;display:flex;align-items:center;justify-content:center;cursor:pointer" data-open-pdf="${f.id}">📄</div>
      <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</div>
      <button class="btn pri" style="height:32px;font-size:13px;justify-content:center" data-open-pdf="${f.id}">افتح</button>
    </div>
  `).join('');
}

function renderHomePreview(){
  const prev=document.getElementById('homeLibPreview');
  if(!prev) return;
  prev.innerHTML=pdfState.files.slice(0,4).map(f=>`
    <div class="card" style="padding:10px;cursor:pointer" data-open-pdf="${f.id}">
      <div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</div>
    </div>
  `).join('')||'<div class="mut">لا توجد ملفات.</div>';
}

document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open-pdf]');
  if(o){const f=pdfState.files.find(x=>x.id===o.dataset.openPdf); if(f) openPdf(f);}
});

async function openPdf(file){
  pdfState.current=file; go('study');
  const paper=document.getElementById('paper');
  paper.innerHTML='<div style="margin:auto;color:#566178">جاري التحميل…</div>';
  try{
    pdfState.doc=await pdfjsLib.getDocument({data:new Uint8Array(file.data)}).promise;
    paper.innerHTML='';
    for(let i=1; i<=pdfState.doc.numPages; i++){
      const canvas=document.createElement('canvas');
      canvas.style.cssText='display:block;margin:0 auto 20px;box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:100%;background:#fff;';
      paper.appendChild(canvas);
      const page=await pdfState.doc.getPage(i);
      const vp=page.getViewport({scale:1.35});
      canvas.width=vp.width; canvas.height=vp.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    }
    document.getElementById('pdfFileTitleBanner'].textContent=`${file.name} (${pdfState.doc.numPages} صفحة)`;
  }catch(err){paper.innerHTML='<div style="margin:auto;color:#B42318">تعذر عرض الملف.</div>';}
}

function renderQuizHome(){
  const qMain = document.getElementById('qMain');
  if(!qMain) return;
  const files = pdfState.files;
  
  if(!files.length){
    qMain.innerHTML=`<h1>الاختبارات الذكية والبطاقات</h1><div class="card" style="padding:40px;text-align:center"><h2>لا توجد ملفات</h2><button class="btn pri" data-import-pdf>استيراد PDF</button></div>`;
    return;
  }

  qMain.innerHTML=`
    <h1>الاختبارات الذكية والبطاقات</h1>
    <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:16px;max-width:700px">
      <label style="font-weight:600">اختر الملف:</label>
      <select id="quizFileSelect" class="inp">${files.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select>
      
      <label style="font-weight:600">نوع الاختبار:</label>
      <select id="quizTypeSelect" class="inp">
        <option value="mcq">خيارات متعددة (MCQ شاملة)</option>
        <option value="flashcards">بطاقات استذكار شاملة</option>
      </select>

      <button class="btn pri" id="startPdfQuizBtn">✨ توليد اختبار شامل من الكتاب (مع الفحص البصري الدائم)</button>
    </div>
  `;

  document.getElementById('startPdfQuizBtn').onclick = async () => {
    const fileId = document.getElementById('quizFileSelect').value;
    const type = document.getElementById('quizTypeSelect').value;
    const file = files.find(f => f.id === fileId);
    if(!file) return;

    qMain.innerHTML=`<div style="margin:auto;text-align:center;font-size:16px;font-weight:600">🔄 جاري تفعيل الفحص البصري الشامل (OCR) لكامل صفحات الكتاب... يرجى الانتظار</div>`;

    try{
      const doc = await pdfjsLib.getDocument({data: new Uint8Array(file.data)}).promise;
      let fullText = '';
      
      // تشغيل المسح البصري (OCR) دائماً وبشكل إجباري لكل صفحات الكتاب لضمان نقاء الحروف
      for(let i=1; i<=doc.numPages; i++){
        qMain.innerHTML=`<div style="margin:auto;text-align:center;font-size:16px;font-weight:600">🔄 جاري قراءة الصفحة ${i} من ${doc.numPages} بصرياً (OCR)...</div>`;
        const page = await doc.getPage(i);
        const vp = page.getViewport({scale: 1.5});
        const canvas = document.createElement('canvas');
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;
        const worker = await Tesseract.createWorker('ara');
        const ret = await worker.recognize(canvas);
        await worker.terminate();
        fullText += ' ' + ret.data.text;
      }

      const questions = generateComprehensiveQuestions(fullText, type);
      runQuizSession(questions, type, 0, 0);
    } catch(err) {
      alert('حدث خطأ أثناء معالجة الكتاب بصرياً.');
      renderQuizHome();
    }
  };
}

function generateComprehensiveQuestions(text, type){
  const sentences = text.split(/[.!?؟؛\n]+/).map(s => s.trim()).filter(s => s.length > 10);
  
  if(!sentences.length){
    return [{q: "ما هو المحتوى الوارد في المستند؟", options: ["المحتوى الأساسي", "عنصر عام", "فقرة رئيسية", "تفاصيل فرعية"], answer: "المحتوى الأساسي", explanation: "سؤال افتراضي."}];
  }

  const step = Math.max(1, Math.floor(sentences.length / 20));
  const selectedSentences = [];
  for(let i = 0; i < sentences.length; i += step){
    selectedSentences.push(sentences[i]);
  }

  const allWords = text.split(/\s+/).filter(w => w.length > 3);
  const uniqueDistractors = [...new Set(allWords)];

  return selectedSentences.map((sent, idx) => {
    const words = sent.split(' ').filter(w => w.length > 3);
    const targetWord = words[Math.floor(words.length / 2)] || words[0];
    const prompt = sent.replace(targetWord, '________');
    let wrongOpts = uniqueDistractors.filter(w => w !== targetWord).sort(() => Math.random() - .5).slice(0, 3);
    while(wrongOpts.length < 3) wrongOpts.push('مفهوم مرتبط');

    return {
      q: type === 'mcq' ? `سؤال شامل (${idx + 1}):\n\nأكمل العبارة من الكتاب:\n"${prompt}"` : `بطاقة استذكار شاملة (${idx + 1}):\n\n"${sent}"`,
      options: [targetWord, ...wrongOpts].sort(() => Math.random() - .5),
      answer: targetWord,
      explanation: `النص الأصلي من الكتاب:\n"${sent}"`
    };
  });
}

function runQuizSession(questions, type, index, score){
  const qMain = document.getElementById('qMain');
  if(!qMain) return;

  if(index >= questions.length){
    qMain.innerHTML=`<div class="card" style="margin:auto;padding:40px;text-align:center"><h1>انتهى الاختبار الشامل!</h1><h3>النتيجة النهائية: ${score} / ${questions.length}</h3><button class="btn pri" onclick="renderQuizHome()">اختبار جديد</button></div>`;
    return;
  }

  const item = questions[index];
  qMain.innerHTML=`
    <div style="display:flex;align-items:center;gap:14px">
      <button class="fab" onclick="renderQuizHome()">↩</button>
      <b>السؤال ${index+1} من ${questions.length}</b>
    </div>
    <div class="card" style="padding:24px;font-size:18px;font-weight:600;white-space:pre-line">${esc(item.q)}</div>
    ${type==='mcq' ? item.options.map(o=>`<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join('') : '<button class="btn pri" id="showAns">إظهار النص الأصلي</button><div id="ansBox" class="hide" style="padding:16px;background:#E4F2F0;border-radius:12px"><b>النص الأصلي:</b> '+esc(item.explanation)+'</div>'}
    <div id="expBox" class="card hide" style="padding:14px;background:#E4F2F0"><b>💡 المرجع من الكتاب:</b> ${esc(item.explanation)}</div>
  `;

  if(type==='mcq'){
    document.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick=()=>{
        const chosen=btn.dataset.opt;
        if(chosen===item.answer) score++;
        document.querySelectorAll('.opt').forEach(b=>{
          if(b.dataset.opt===item.answer) b.classList.add('ok');
          else if(b.dataset.opt===chosen) b.classList.add('no');
        });
        document.getElementById('expBox').classList.remove('hide');
        setTimeout(()=>runQuizSession(questions,type,index+1,score), 3000);
      };
    });
  } else {
    document.getElementById('showAns').onclick=()=>{document.getElementById('ansBox').classList.remove('hide');};
    setTimeout(()=>{runQuizSession(questions,type,index+1,score);}, 5000);
  }
}

function go(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id==='quizzes') renderQuizHome();
  initGlobalSidebars();
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]'); if(g){e.preventDefault(); go(g.dataset.go);}});
</script>
</body>
