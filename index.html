<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول مذاكرتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
:root{
  --paper:#f1e6d3; --card:#ffffff; --sand:#e6d7b9; --sand2:#f6efe1;
  --ink:#3e2a1c; --ink2:#7a6552; --line:#dccfb5; --brown:#8a5a35;
  --ok:#5b7a3d; --ok-bg:#e4e9cd; --warn:#a8461a; --warn-bg:#f6dcc4;
  --shadow:0 1px 2px rgba(62,42,28,.06),0 14px 28px -20px rgba(62,42,28,.5);
  --fb:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --fd:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;direction:rtl;text-align:right;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--brown);outline-offset:2px}
svg{display:block}

.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-top:max(18px,env(safe-area-inset-top,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-family:var(--fd);font-weight:700;font-size:30px;line-height:1.2}
.top h1 span{background:linear-gradient(transparent 64%,var(--sand) 64%,var(--sand) 94%,transparent 94%);padding:0 4px}
.pctchip{font-weight:700;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 14px;font-variant-numeric:tabular-nums}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px}

/* date strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.mlabel{flex:none;align-self:center;font-size:12.5px;font-weight:700;color:var(--ink2);padding:0 4px}
.pill{flex:none;width:60px;padding:9px 0 16px;border-radius:18px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.pill small{font-size:12px;color:var(--ink2);line-height:1.4}
.pill b{font-family:var(--fd);font-size:23px;line-height:1.25;font-variant-numeric:tabular-nums}
.pill .pbar{position:absolute;bottom:7px;left:13px;right:13px;height:4px;border-radius:99px;background:var(--sand);overflow:hidden}
.pill .pbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.pill.today{border-color:var(--brown);border-width:2px}
.pill.today small{color:var(--brown);font-weight:700}
.pill.late::after{content:"";position:absolute;top:7px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.pill.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.sel small{color:#e9dcc2}
.pill.sel .pbar{background:rgba(255,255,255,.25)}
.pill.sel .pbar i{background:#b9d58a}

/* day card */
.dhead{display:flex;align-items:center;gap:10px}
.dtitle{flex:1;min-width:0;text-align:center}
.dtitle h2{margin:0;font-family:var(--fd);font-size:30px;line-height:1.2;font-weight:700}
.dtitle p{margin:2px 0 0;color:var(--ink2);font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;background:var(--brown);color:#fff}
.tag.late{background:var(--warn-bg);color:var(--warn)}
.nav{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--sand2);display:grid;place-items:center;padding:0}
.nav svg{width:20px;height:20px}
.nav:disabled{opacity:.35}
.prog{margin-top:14px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink2)}
.prog span{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:99px;background:var(--sand);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s ease}
.note{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--ok-bg);color:var(--ok);font-weight:600;justify-content:flex-start}
.note .btn{padding:7px 14px;font-size:14px}
.add{margin-top:16px;display:flex;gap:8px}
.add input{flex:1;min-width:0;height:50px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--sand2);font-size:16px}
.add input::placeholder{color:var(--ink2)}
.add input:focus{background:#fff;border-color:var(--brown)}
.add button{flex:none;height:50px;padding:0 20px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:700}
.tasks{list-style:none;margin:12px 0 0;padding:0}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{flex:none;width:36px;height:36px;border-radius:12px;border:2px solid var(--ink2);background:#fff;display:grid;place-items:center;color:transparent;padding:0;transition:background .15s}
.chk svg{width:20px;height:20px}
.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ttext{flex:1;min-width:0;padding:6px 6px;border-radius:8px;overflow-wrap:anywhere;font-size:17px;line-height:1.5}
.ttext:focus{background:var(--sand2);outline:2px solid var(--brown)}
.done .ttext{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:2px}
.ico{flex:none;width:40px;height:40px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink2);padding:0}
.ico:hover{background:var(--sand2)}
.ico svg{width:20px;height:20px}
.empty{margin-top:18px;text-align:center;padding:26px 12px;border:1.5px dashed var(--line);border-radius:16px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:2px}
.empty p{margin:0;font-size:14.5px}

/* all days */
.hero{display:flex;align-items:center;gap:18px}
.ring{flex:none;position:relative;width:104px;height:104px}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .tr{stroke:var(--sand)}
.ring .pg{stroke:var(--brown);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:28px;font-variant-numeric:tabular-nums}
.hmain{flex:1;min-width:0}
.hmain h2{margin:0;font-size:17px}
.hmain p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 0}
.stats div{background:var(--sand2);border-radius:12px;padding:8px 10px;min-width:0}
.stats dt{font-size:12.5px;color:var(--ink2)}
.stats dd{margin:0;font-family:var(--fd);font-weight:700;font-size:22px;line-height:1.3;font-variant-numeric:tabular-nums}
.stats .late.on{background:var(--warn-bg)}
.stats .late.on dt,.stats .late.on dd{color:var(--warn)}
.week{margin:6px 4px -6px;font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.week small{font-weight:400;color:var(--ink2);font-size:13.5px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:right;min-width:0}
.row:active{background:var(--sand2)}
.row.today{border:2px solid var(--brown);padding:9px 11px}
.rnum{flex:none;width:50px;height:52px;border-radius:12px;background:var(--sand2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.rnum b{font-family:var(--fd);font-size:22px;font-variant-numeric:tabular-nums}
.rnum small{font-size:11px;color:var(--ink2)}
.row.done .rnum{background:var(--ok-bg);color:var(--ok)}
.row.done .rnum small{color:var(--ok)}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column}
.rmain strong{font-size:16px;display:flex;align-items:center;gap:8px}
.rsub{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rside{flex:none;width:58px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.mbar{width:100%;height:6px;border-radius:99px;background:var(--sand);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.row>svg{flex:none;width:18px;height:18px;color:var(--ink2)}

/* more */
.sect h3{margin:0 0 4px;font-size:18px}
.sect p{margin:0 0 14px;color:var(--ink2);font-size:14.5px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--ink2)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);width:100%;padding:14px 18px;font-size:16px}
.btn.primary:disabled{opacity:.7}
.btn.ghost{background:transparent;color:var(--warn);border-color:transparent}

/* tabs + toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;color:var(--ink2);font-size:12.5px;font-weight:600}
.tab .ti{width:56px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .15s}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ti{background:var(--sand)}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));width:max-content;max-width:min(92vw,520px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:14.5px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast button{background:none;border:0;color:#f0d9a8;font-weight:700;padding:0;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1><span>جدول مذاكرتي</span></h1>
    <span class="pctchip" id="top-pct" dir="ltr" aria-label="نسبة الإنجاز">0%</span>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="التنقل">
  <div class="tabs-in">
    <button class="tab" type="button" data-tab="day"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 15l2 2 4-4"/></svg></span>اليوم</button>
    <button class="tab" type="button" data-tab="all"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></span>الجدول</button>
    <button class="tab" type="button" data-tab="more"><span class="ti"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></span>المزيد</button>
  </div>
</nav>

<div id="toast" class="toast" hidden></div>
<input type="file" id="restore-file" accept="application/json,.json" hidden>

<script>
(function(){
  var KEY='study-plan-v1';
  var START='2026-10-17', END='2026-11-08';
  var WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var AB=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  var MO=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  /* ---------- helpers ---------- */
  function parse(s){var p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]));}
  function fmt(d){return d.toISOString().slice(0,10);}
  function addDays(s,n){var d=parse(s);d.setUTCDate(d.getUTCDate()+n);return fmt(d);}
  function wd(s){return parse(s).getUTCDay();}
  function dnum(s){return +s.slice(8);}
  function mon(s){return MO[+s.slice(5,7)-1];}
  function diff(a,b){return Math.round((parse(b)-parse(a))/864e5);}
  function today(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
  function label(s){return WD[wd(s)]+' '+dnum(s)+' '+mon(s);}
  function uid6(){return Math.random().toString(36).slice(2,8);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function clone(o){return JSON.parse(JSON.stringify(o));}
  function noun(n){return n===1?'مهمة':'مهام';}

  /* ---------- state ---------- */
  function seed(){
    var days=[],n=diff(START,END)+1;
    for(var i=0;i<n;i++){
      var date=addDays(START,i),w=wd(date),t;
      if(i===n-1) t=['مراجعة شاملة للملخصات','جهّز أدواتك وأغراضك ونم بدري'];
      else if(i===n-2) t=['اختبار تجريبي كامل بنفس وقت الاختبار','راجع الأخطاء اللي طلعت لك'];
      else if(w===5) t=['يوم خفيف: مراجعة سريعة 30 دقيقة','مشي أو رياضة 20 دقيقة'];
      else t=['مراجعة ملخص أمس (30 دقيقة)','وحدة أو درس جديد (جلستين بومودورو)','حل 10 أسئلة تدريب'];
      days.push({date:date,tasks:t.map(function(x){return {id:uid6(),t:x,d:false};})});
    }
    return {v:1,days:days};
  }
  function loadLocal(){
    try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&Array.isArray(o.days)&&o.days.length)return o;}}catch(e){}
    return null;
  }
  var state=loadLocal()||seed();
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function todayIndex(){var t=today();for(var i=0;i<state.days.length;i++)if(state.days[i].date===t)return i;return -1;}
  function defaultSel(){
    var ti=todayIndex();if(ti>=0)return ti;
    return today()<state.days[0].date?0:state.days.length-1;
  }
  function totals(){
    var t=today(),total=0,done=0,late=0;
    state.days.forEach(function(d){d.tasks.forEach(function(k){total++;if(k.d)done++;else if(d.date<t)late++;});});
    return {total:total,done:done,late:late};
  }
  var ui={tab:'day',sel:defaultSel(),center:true};
  var refocus=null,toastTimer=null;

  /* ---------- icons ---------- */
  var I_CHECK='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.6 3.6L15.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function ico(d){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';}
  var I_CH_R=ico('<path d="M9 5l7 7-7 7"/>'), I_CH_L=ico('<path d="M15 5l-7 7 7 7"/>');
  var I_TRASH=ico('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>');
  var I_PUSH=ico('<path d="M19 12H5M11 6l-6 6 6 6"/>');
  var I_DOWN=ico('<path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/>');

  /* ---------- toast ---------- */
  function toast(msg,actLabel,act,ms){
    var el=document.getElementById('toast');
    clearTimeout(toastTimer);
    el.innerHTML='<span></span>';
    el.firstChild.textContent=msg;
    if(actLabel){
      var b=document.createElement('button');b.type='button';b.textContent=actLabel;
      b.addEventListener('click',function(){el.hidden=true;act();});
      el.appendChild(b);
    }
    el.hidden=false;
    toastTimer=setTimeout(function(){el.hidden=true;},ms||(actLabel?7000:3500));
  }

  /* ---------- views ---------- */
  function dayStats(d){var done=d.tasks.filter(function(k){return k.d;}).length;return {total:d.tasks.length,done:done,complete:d.tasks.length>0&&done===d.tasks.length};}
  function lateOf(d){return d.date<today()?d.tasks.filter(function(k){return !k.d;}).length:0;}

  function stripHtml(){
    var h='',lastM='',t=today();
    state.days.forEach(function(d,i){
      var m=mon(d.date);
      if(m!==lastM){h+='<span class="mlabel">'+m+'</span>';lastM=m;}
      var s=dayStats(d),late=lateOf(d);
      var cls='pill'+(i===ui.sel?' sel':'')+(d.date===t?' today':'')+(late?' late':'');
      h+='<button type="button" class="'+cls+'" data-act="pick" data-i="'+i+'"'+(i===ui.sel?' aria-current="true"':'')+' aria-label="'+label(d.date)+'">'+
        '<small>'+AB[wd(d.date)]+'</small><b>'+dnum(d.date)+'</b>'+
        (s.total?'<span class="pbar"><i style="width:'+Math.round(s.done/s.total*100)+'%"></i></span>':'')+
      '</button>';
    });
    return '<div class="strip" role="group" aria-label="أيام الجدول">'+h+'</div>';
  }
  function dayView(){
    if(ui.sel>=state.days.length) ui.sel=state.days.length-1;
    var i=ui.sel,d=state.days[i],n=state.days.length,t=today();
    var s=dayStats(d),pct=s.total?Math.round(s.done/s.total*100):0;
    var ti=todayIndex(),totalLate=totals().late;
    var h=stripHtml();
    h+='<section class="card">'+
      '<div class="dhead">'+
        '<button type="button" class="nav" data-act="prev" aria-label="اليوم السابق"'+(i===0?' disabled':'')+'>'+I_CH_R+'</button>'+
        '<div class="dtitle"><h2>'+WD[wd(d.date)]+'</h2><p>'+dnum(d.date)+' '+mon(d.date)+' '+d.date.slice(0,4)+
          (d.date===t?'<span class="tag">اليوم</span>':'')+(lateOf(d)?'<span class="tag late">متأخر '+lateOf(d)+'</span>':'')+'</p></div>'+
        '<button type="button" class="nav" data-act="next" aria-label="اليوم التالي"'+(i===n-1?' disabled':'')+'>'+I_CH_L+'</button>'+
      '</div>'+
      '<div class="prog"><span>'+(s.total?s.done+' من '+s.total+' '+noun(s.total):'ما فيه مهام')+'</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div></div>';
    if(i===ti&&totalLate>0){
      h+='<div class="note warn"><span>فاتتك '+totalLate+' '+noun(totalLate)+' من أيام سابقة</span><button type="button" class="btn" data-act="rollover">انقلها لليوم</button></div>';
    }else if(s.complete){
      h+='<div class="note ok">'+ico('<path d="M5 12l4.5 4.5L19 7"/>').replace('<svg','<svg width="20" height="20"')+'<span>خلصت كل مهام اليوم، أحسنت.</span></div>';
    }

  /* ---------- actions ---------- */
  var view=document.getElementById('view');
  view.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b)return;
    var act=b.dataset.act,n=state.days.length;
    if(act==='pick'){ui.sel=+b.dataset.i;ui.center=true;render();return;}
    if(act==='prev'||act==='next'){
      ui.sel=Math.max(0,Math.min(n-1,ui.sel+(act==='prev'?-1:1)));ui.center=true;render();return;
    }
    if(act==='open'){go('day',+b.dataset.i);return;}
    if(act==='toggle'||act==='del'||act==='push'){
      var li=b.closest('.task'),day=state.days[ui.sel];
      var idx=day.tasks.findIndex(function(x){return x.id===li.dataset.t;});if(idx<0)return;
      if(act==='toggle'){day.tasks[idx].d=!day.tasks[idx].d;persist();render();return;}
      if(act==='del'){
        var removed=day.tasks.splice(idx,1)[0];persist();render();
        toast('تم حذف المهمة','تراجع',function(){day.tasks.splice(Math.min(idx,day.tasks.length),0,removed);persist();render();});
        return;
      }
      if(ui.sel>=n-1)return;
      var k=day.tasks.splice(idx,1)[0],nx=state.days[ui.sel+1];
      nx.tasks.push(k);persist();render();
      toast('نقلتها إلى '+label(nx.date),'تراجع',function(){nx.tasks=nx.tasks.filter(function(x){return x!==k;});day.tasks.splice(Math.min(idx,day.tasks.length),0,k);persist();render();});
      return;
    }
    if(act==='rollover'){
      var ti=todayIndex();if(ti<0)return;
      var snap=clone(state),moved=0;
      for(var j=0;j<ti;j++){
        var keepT=[];
        state.days[j].tasks.forEach(function(x){if(x.d)keepT.push(x);else{state.days[ti].tasks.push(x);moved++;}});
        state.days[j].tasks=keepT;
      }
      persist();render();
      toast('نقلت '+moved+' '+noun(moved)+' لليوم','تراجع',function(){state=snap;persist();render();});
      return;
    }
    if(act==='addday'){
      var cnt=+b.dataset.n,last=state.days[n-1].date;
      for(var q=1;q<=cnt;q++) state.days.push({date:addDays(last,q),tasks:[]});
      persist();render();toast('أضفت '+(cnt===1?'يوم':cnt+' أيام')+' للجدول');return;
    }
    if(act==='rmlast'){
      if(n<2)return;
      var rem=state.days.pop();persist();render();
      toast('حذفت '+label(rem.date),'تراجع',function(){state.days.push(rem);persist();render();});
      return;
    }
    if(act==='backup'){
      var blob=new Blob([JSON.stringify({app:'study-plan',v:1,exportedAt:new Date().toISOString(),state:state})],{type:'application/json'});
      saveBlob(blob,'نسخة-جدول-مذاكرتي.json');toast('تم حفظ النسخة');return;
    }
    if(act==='restore'){document.getElementById('restore-file').click();return;}
    if(act==='pdf'){exportPdf(b);return;}
  });

  var FB='"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif', FD='"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif';
  async function ensureFonts(){
    try{await Promise.all([

  function drawPoster(){
    var W=2339,H=1654,M=64;
    var INK='#3e2a1c',MUTED='#7a6552',LINE='#d6c5a0',TINT='#e9dcc2',PAGE='#f4ecda',OK='#5b7a3d',OKBG='#e6ebd2',MARK='#d9c6a0';
    var cv=document.createElement('canvas');cv.width=W;cv.height=H;
    var ctx=cv.getContext('2d');
    ctx.fillStyle=PAGE;ctx.fillRect(0,0,W,H);
    ctx.direction='rtl';ctx.textAlign='right';ctx.textBaseline='alphabetic';
    var s=totals(),first=state.days[0].date,last=state.days[state.days.length-1].date;
    var pct=s.total?Math.round(s.done/s.total*100):0;

    /* header */
    var title='جدول مذاكرتي',base=M+84;
    ctx.font='700 96px '+FD;
    var tw=ctx.measureText(title).width;
    ctx.fillStyle=MARK;ctx.fillRect(W-M-tw-14,base-34,tw+28,36);
    ctx.fillStyle=INK;ctx.fillText(title,W-M,base);
    ctx.font='400 34px '+FB;ctx.fillStyle=MUTED;
    ctx.fillText('من '+dnum(first)+' '+mon(first)+' إلى '+dnum(last)+' '+mon(last)+' · '+state.days.length+' يوم',W-M,base+58);
    ctx.textAlign='left';
    ctx.direction='ltr';ctx.fillStyle=INK;ctx.font='700 96px '+FD;ctx.fillText(pct+'%',M,base);
    ctx.direction='rtl';ctx.font='400 32px '+FB;ctx.fillStyle=MUTED;
    ctx.fillText('منجز '+s.done+' من '+s.total,M,base+58);
    ctx.textAlign='right';
    var by=base+92,bw=W-2*M;
    ctx.fillStyle=TINT;ctx.fillRect(M,by,bw,18);
    ctx.fillStyle=OK;var fw=bw*pct/100;ctx.fillRect(W-M-fw,by,fw,18);
    var gridTop=by+18+40,availH=H-M-gridTop;

    function wrap(text,font,maxW){
      ctx.font=font;
      var words=text.split(/\s+/),lines=[],cur='';
      words.forEach(function(w){
        var test=cur?cur+' '+w:w;
        if(!cur||ctx.measureText(test).width<=maxW) cur=test; else{lines.push(cur);cur=w;}
      });
      if(cur) lines.push(cur);
      return lines;
    }
    function layout(cols,fs){
      var gap=18,cw=(W-2*M-gap*(cols-1))/cols;
      var pad=fs*0.6,box=fs*0.85,lh=fs*1.45,hh=fs*2.1,sp=fs*0.35;
      var maxW=cw-2*pad-box-fs*0.5;
      var cards=state.days.map(function(d){
        var items=d.tasks.map(function(k){return {k:k,lines:wrap(k.t,'400 '+fs+'px '+FB,maxW)};});
        var body=items.length?items.reduce(function(a,it){return a+it.lines.length*lh+sp;},0):lh;
        return {d:d,items:items,h:hh+pad*0.5+body+pad*0.5};
      });
      var rowHs=[],total=0;
      for(var i=0;i<cards.length;i+=cols){
        var mh=0;for(var j=i;j<Math.min(i+cols,cards.length);j++) mh=Math.max(mh,cards[j].h);
        rowHs.push(mh);total+=mh;
      }
      total+=gap*(rowHs.length-1);
      return {cols:cols,fs:fs,cards:cards,rowHs:rowHs,total:total,cw:cw,gap:gap,pad:pad,box:box,lh:lh,hh:hh,sp:sp,maxW:maxW};
    }
    var best=null;
    for(var cols=2;cols<=9;cols++){
      for(var fs=38;fs>=10;fs--){
        var L=layout(cols,fs);
        if(L.total<=availH){if(!best||fs>best.fs)best=L;break;}
      }
    }
    if(!best) best=layout(9,10);

    function rr(x,y,w,h,r){
      ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
      ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
      ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    }
    var B=best,y=gridTop;
    B.rowHs.forEach(function(rowH,r){
      for(var c=0;c<B.cols;c++){
        var idx=r*B.cols+c; if(idx>=B.cards.length) break;
        var cd=B.cards[idx],d=cd.d;
        var right=W-M-c*(B.cw+B.gap),left=right-B.cw;
        var total=d.tasks.length,done=d.tasks.filter(function(k){return k.d;}).length,complete=total>0&&done===total;
        rr(left,y,B.cw,rowH,14);ctx.fillStyle='#ffffff';ctx.fill();
        ctx.save();rr(left,y,B.cw,rowH,14);ctx.clip();
        ctx.fillStyle=complete?OKBG:TINT;ctx.fillRect(left,y,B.cw,B.hh);ctx.restore();
        rr(left,y,B.cw,rowH,14);ctx.strokeStyle=LINE;ctx.lineWidth=2;ctx.stroke();
        ctx.textAlign='right';ctx.fillStyle=INK;ctx.font='700 '+(B.fs*1.05)+'px '+FB;
        ctx.fillText(label(d.date),right-B.pad,y+B.hh*0.66);
        if(total){
          ctx.textAlign='left';ctx.fillStyle=complete?OK:MUTED;ctx.font='600 '+(B.fs*0.85)+'px '+FB;
          ctx.fillText(done+'/'+total,left+B.pad,y+B.hh*0.66);ctx.textAlign='right';
        }
        var ty=y+B.hh+B.pad*0.5,textR=right-B.pad-B.box-B.fs*0.5;
        if(!cd.items.length){ctx.fillStyle=MUTED;ctx.font='400 '+B.fs+'px '+FB;ctx.fillText('—',right-B.pad,ty+B.lh*0.8);}
        cd.items.forEach(function(it){
          var ly=ty+B.lh*0.8,bx=right-B.pad-B.box,bY=ly-B.box*0.88;
          ctx.lineWidth=Math.max(2,B.fs*0.09);
          if(it.k.d){
            ctx.fillStyle=OK;ctx.fillRect(bx,bY,B.box,B.box);
            ctx.strokeStyle='#ffffff';ctx.lineCap='round';ctx.lineJoin='round';
            ctx.beginPath();ctx.moveTo(bx+B.box*0.2,bY+B.box*0.52);ctx.lineTo(bx+B.box*0.42,bY+B.box*0.74);ctx.lineTo(bx+B.box*0.8,bY+B.box*0.26);ctx.stroke();
          }else{ctx.strokeStyle=INK;ctx.strokeRect(bx+ctx.lineWidth/2,bY+ctx.lineWidth/2,B.box-ctx.lineWidth,B.box-ctx.lineWidth);}
          ctx.font='400 '+B.fs+'px '+FB;
          it.lines.forEach(function(ln,li){
            var yy=ly+li*B.lh;
            ctx.fillStyle=it.k.d?MUTED:INK;ctx.fillText(ln,textR,yy);
            if(it.k.d){var lw=ctx.measureText(ln).width;ctx.fillStyle=MUTED;ctx.fillRect(textR-lw,yy-B.fs*0.3,lw,Math.max(2,B.fs*0.07));}
          });
          ty+=it.lines.length*B.lh+B.sp;
        });
      }
      y+=rowH+B.gap;
    });
    return cv;
  }
  function toJpeg(c){
    return new Promise(function(res,rej){
      c.toBlob(function(b){
        if(!b){rej(new Error('jpeg'));return;}
        b.arrayBuffer().then(function(buf){res({bytes:new Uint8Array(buf),w:c.width,h:c.height});},rej);
      },'image/jpeg',0.92);
    });
  }
  function makePdf(jpegs){
    var enc=new TextEncoder(),chunks=[],pos=0,offs=[];
    function w(x){var b=typeof x==='string'?enc.encode(x):x;chunks.push(b);pos+=b.length;}
    function begin(id){offs[id]=pos;w(id+' 0 obj\n');}
    var n=jpegs.length;
    w('%PDF-1.4\n');
    begin(1);w('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    begin(2);w('<< /Type /Pages /Kids ['+jpegs.map(function(_,i){return (3+3*i)+' 0 R';}).join(' ')+'] /Count '+n+' >>\nendobj\n');
    jpegs.forEach(function(j,i){
      var pid=3+3*i,cid=4+3*i,iid=5+3*i,land=j.w>j.h,PW=land?841.89:595.28,PH=land?595.28:841.89;
      begin(pid);w('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>\nendobj\n');
      var cs='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';
      begin(cid);w('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
      begin(iid);w('<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.bytes.length+' >>\nstream\n');
      w(j.bytes);w('\nendstream\nendobj\n');
    });
    var total=3+3*n,xref=pos;
    w('xref\n0 '+total+'\n0000000000 65535 f \n');
    for(var id=1;id<total;id++) w(String(offs[id]).padStart(10,'0')+' 00000 n \n');
    w('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
    return new Blob(chunks,{type:'application/pdf'});
  }
  async function exportPdf(btn){
    var lab=btn.querySelector('span');
    btn.disabled=true;lab.textContent='جاري التجهيز…';
    try{
      await ensureFonts();
      var jpeg=await toJpeg(drawPoster());
      saveBlob(makePdf([jpeg]),'جدول-مذاكرتي.pdf');
      toast('تم تجهيز ملف PDF');
    }catch(e){toast('ما قدرت أجهّز الملف. جرّب مرة ثانية.');}
    if(btn.isConnected){btn.disabled=false;lab.textContent='تحميل الجدول PDF';}
  }

  /* ---------- boot ---------- */
  render();
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&(document.activeElement===document.body||!document.activeElement)) render();
  });
})();
</script>
