<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><title>الجدول والتخطيط</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <div class="side"></div>
  <div class="main">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1>الجدول والتخطيط</h1>
      <button class="btn pri" id="addBtn">إضافة حصة</button>
    </div>
    <div id="schedContainer" class="card" style="padding:16px;flex:1;overflow:auto"></div>
  </div>
</div>
<script type="module">
  import { initSidebar } from './js/sidebar.js';
  import { makeId, esc } from './js/db.js';
  initSidebar('schedule');

  const KEY = 'rafeeq-school-timetable-v1';
  const DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'];

  function render() {
    const s = JSON.parse(localStorage.getItem(KEY) || '{"classes":[]}');
    document.getElementById('schedContainer').innerHTML = `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">${DAYS.map(day => `
      <div style="background:#F3F5F9;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px">
        <div style="font-weight:700;text-align:center;padding:6px;background:#fff;border-radius:8px">${day}</div>
        ${s.classes.filter(c => c.day === day).map(c => `<div style="background:#fff;padding:8px;border-radius:8px;font-size:13px;font-weight:600">${esc(c.title)}</div>`).join('')}
      </div>`).join('')}</div>`;
  }
  document.getElementById('addBtn').onclick = () => {
    const title = prompt('اسم المادة:');
    const day = prompt('اليوم (الأحد، الإثنين، الثلاثاء، الأربعاء، الخميس):', 'الأحد');
    if (title && DAYS.includes(day)) {
      const s = JSON.parse(localStorage.getItem(KEY) || '{"classes":[]}');
      s.classes.push({ id: makeId(), title, day });
      localStorage.setItem(KEY, JSON.stringify(s));
      render();
    }
  };
  render();
</script>
</body>
</html>
