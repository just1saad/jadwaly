<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>رفيق المذاكرة - عرض المستند</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
</head>
<body style="background:#E9ECF2;">

<div style="position:relative;width:100vw;height:100vh;overflow:hidden;">
  <!-- منطقة عرض صفحات PDF -->
  <div dir="ltr" id="paper" style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:850px;height:100%;background:#fff;box-shadow:0 0 24px rgba(20,33,61,.12);padding:92px 32px 56px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;">
    <div style="margin:auto;color:#566178;">جاري تحميل المستند...</div>
  </div>

  <!-- الشريط العلوي الأيمن -->
  <div style="position:absolute;top:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:30">
    <a href="library.html" aria-label="رجوع" style="width:44px;height:44px;border-radius:12px;background:#fff;color:#14213D;box-shadow:0 2px 10px rgba(20,33,61,.15);display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <div id="pdfFileTitleBanner" style="background:#fff;border-radius:12px;height:44px;padding:0 14px;display:flex;align-items:center;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(20,33,61,.15)">جاري التحميل...</div>
  </div>

  <!-- الشريط العلوي الأيسر (الفهرس والذكاء الاصطناعي) -->
  <div style="position:absolute;top:12px;left:12px;display:flex;gap:8px;z-index:30">
    <button id="btnThumbToggle" title="الصفحات" style="width:44px;height:44px;border:0;border-radius:12px;background:#fff;color:#14213D;box-shadow:0 2px 10px rgba(20,33,61,.15);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></button>
    <button id="bAI" title="مساعد الذكاء الاصطناعي" style="width:44px;height:44px;border:0;border-radius:12px;background:#fff;color:#14213D;box-shadow:0 2px 10px rgba(20,33,61,.15);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg></button>
  </div>

  <!-- شريط أدوات الرسم -->
  <div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;height:60px;padding:0 12px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 20px rgba(20,33,61,.22);z-index:30">
    <button class="tool-btn" data-tool="pen" style="width:44px;height:44px;border:0;border-radius:12px;background:#0B5F58;color:#fff;display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></button>
    <button class="tool-btn" data-tool="highlighter" style="width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#44506A;display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14l7-7 3 3-7 7H9z"/><path d="M4 20h8"/></svg></button>
    <button class="tool-btn" data-tool="eraser" style="width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#44506A;display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 20h12M5 15l9-9 5 5-6 6H8z"/></svg></button>
    <button class="tool-btn" data-tool="text" style="width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#44506A;display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    <span style="width:1px;height:26px;background:#D5DBE7;margin:0 4px;"></span>
    <input type="color" id="colorPicker" value="#14213D" style="width:30px;height:30px;border:0;background:transparent;cursor:pointer;">
  </div>

  <!-- قائمة الذكاء الاصطناعي الجانبية -->
  <div id="aiDr" class="hide" style="position:absolute;top:76px;left:20px;width:350px;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(20,33,61,.25);padding:18px;display:flex;flex-direction:column;gap:12px;z-index:35;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="font-size:15px;">مساعد الذكاء الاصطناعي للملف</h2>
      <button id="closeAiDr" style="width:28px;height:28px;border:0;background:#F3F5F9;border-radius:6px;">✕</button>
    </div>
    <div id="studyAiChatBox" style="background:#F3F5F9;border-radius:12px;padding:10px;height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;">
      <div style="background:#fff;padding:8px;border-radius:8px;">أنا جاهز لتحليل هذا الملف والإجابة على أسئلتك وتوليد الاختبارات!</div>
    </div>
    <div style="display:flex;gap:6px;">
      <input type="text" id="studyAiInput" class="inp" placeholder="اسأل عن محتوى الملف..." style="height:36px;font-size:12px;">
      <button id="studyAiSendBtn" class="btn pri" style="height:36px;font-size:12px;padding:0 12px;">إرسال</button>
    </div>
    <button class="btn pri" id="internalGenQuizBtn" style="height:38px;font-size:12px;">توليد اختبار تفاعلي من الملف</button>
    <div id="internalQuizContainer" style="max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
  </div>

  <!-- قائمة فهرس الصفحات -->
  <div id="thumbDr" class="hide" style="position:absolute;top:76px;right:20px;width:160px;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(20,33,61,.25);padding:14px;display:flex;flex-direction:column;gap:10px;z-index:35;max-height:80vh;overflow-y:auto;">
    <div style="font-weight:700;font-size:13px;text-align:center;">الصفحات</div>
    <div id="thumbList" style="display:flex;flex-direction:column;gap:8px;align-items:center;"></div>
  </div>
</div>

<script type="module">
  import { storeAction, esc } from './js/db.js';
  import { generateAccurateQuestions } from './js/quiz-engine.js';

  const urlParams = new URLSearchParams(window.location.search);
  const fileId = urlParams.get('id');
  let fullTextCache = '';
  let currentTool = 'pen';
  let strokeColor = '#14213D';

  // تحميل الملف وعرضه
  async function loadDocument() {
    if (!fileId) {
      document.getElementById('paper').innerHTML = '<div style="margin:auto;text-align:center;">لم يتم تحديد ملف. <a href="library.html">العودة للمكتبة</a></div>';
      return;
    }
    const files = await storeAction('files', 'readonly', 'getAll');
    const file = files.find(f => f.id === fileId);
    if (!file || !file.data) {
      document.getElementById('paper').innerHTML = '<div style="margin:auto;color:#B42318;">الملف غير موجود أو تالف.</div>';
      return;
    }

    try {
      const blob = new Blob([file.data], { type: 'application/pdf' });
      const pdfUrl = URL.createObjectURL(blob);
      const doc = await pdfjsLib.getDocument(pdfUrl).promise;

      const paper = document.getElementById('paper');
      const thumbList = document.getElementById('thumbList');
      paper.innerHTML = '';
      thumbList.innerHTML = '';

      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const vp = page.getViewport({ scale: 1.5 });
        const dpr = window.devicePixelRatio || 1;

        const wrapper = document.createElement('div');
        wrapper.style.cssText = 'position:relative;margin:0 auto 20px;width:100%;';

        const canvas = document.createElement('canvas');
        canvas.width = vp.width * dpr;
        canvas.height = vp.height * dpr;
        canvas.style.cssText = 'display:block;width:100%;height:auto;box-shadow:0 4px 16px rgba(0,0,0,.15);';
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;

        const drawCanvas = document.createElement('canvas');
        drawCanvas.width = vp.width * dpr;
        drawCanvas.height = vp.height * dpr;
        drawCanvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;z-index:5;';
        setupCanvasDrawing(drawCanvas, vp.width, vp.height);

        wrapper.appendChild(canvas);
        wrapper.appendChild(drawCanvas);
        paper.appendChild(wrapper);

        // المصغرات
        const tCanvas = document.createElement('canvas');
        const tvp = page.getViewport({ scale: 0.2 });
        tCanvas.width = tvp.width; tCanvas.height = tvp.height;
        tCanvas.style.cssText = 'width:100px;cursor:pointer;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.1);';
        await page.render({ canvasContext: tCanvas.getContext('2d'), viewport: tvp }).promise;
        tCanvas.onclick = () => wrapper.scrollIntoView({ behavior: 'smooth' });
        thumbList.appendChild(tCanvas);

        // استخراج النص للذكاء الاصطناعي
        const txt = await page.getTextContent();
        fullTextCache += ' ' + txt.items.map(item => item.str).join(' ');
      }
      document.getElementById('pdfFileTitleBanner').textContent = `${file.name} (${doc.numPages} صفحة)`;
    } catch (e) {
      document.getElementById('paper').innerHTML = '<div style="margin:auto;color:#B42318;">حدث خطأ أثناء عرض PDF.</div>';
    }
  }

  function setupCanvasDrawing(canvas, w, h) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    ctx.scale(dpr, dpr);
    let drawing = false;

    const getPos = e => {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) * (w / rect.width), y: (e.clientY - rect.top) * (h / rect.height) };
    };

    canvas.onmousedown = e => {
      const pos = getPos(e);
      if (currentTool === 'text') {
        const txt = prompt('أدخل النص:');
        if (txt) { ctx.font = "16px 'IBM Plex Sans Arabic'"; ctx.fillStyle = strokeColor; ctx.fillText(txt, pos.x, pos.y); }
        return;
      }
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineCap = 'round';
      ctx.globalCompositeOperation = currentTool === 'highlighter' ? 'multiply' : 'source-over';
    };

    canvas.onmousemove = e => {
      if (!drawing) return;
      const pos = getPos(e);
      if (currentTool === 'eraser') {
        ctx.clearRect(pos.x - 15, pos.y - 15, 30, 30);
      } else {
        ctx.strokeStyle = currentTool === 'highlighter' ? strokeColor + '55' : strokeColor;
        ctx.lineWidth = currentTool === 'highlighter' ? 18 : 3;
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }
    };
    canvas.onmouseup = () => drawing = false;
  }

  // أدوات الشريط العلوي
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tool-btn').forEach(b => { b.style.background = 'transparent'; b.style.color = '#44506A'; });
      btn.style.background = '#0B5F58'; btn.style.color = '#fff';
      currentTool = btn.dataset.tool;
    };
  });
  document.getElementById('colorPicker').oninput = e => strokeColor = e.target.value;

  // القوائم الجانبية (AI والصفحات)
  const aiDr = document.getElementById('aiDr');
  const thumbDr = document.getElementById('thumbDr');
  document.getElementById('bAI').onclick = () => { aiDr.classList.toggle('hide'); thumbDr.classList.add('hide'); };
  document.getElementById('closeAiDr').onclick = () => aiDr.classList.add('hide');
  document.getElementById('btnThumbToggle').onclick = () => { thumbDr.classList.toggle('hide'); aiDr.classList.add('hide'); };

  // محادثة الذكاء الاصطناعي داخل الملف
  document.getElementById('studyAiSendBtn').onclick = () => {
    const inp = document.getElementById('studyAiInput');
    const box = document.getElementById('studyAiChatBox');
    const q = inp.value.trim();
    if (!q) return;
    box.innerHTML += `<div style="background:#0B5F58;color:#fff;padding:6px 10px;border-radius:8px;align-self:flex-end;">${esc(q)}</div>`;
    inp.value = '';
    setTimeout(() => {
      const snippet = fullTextCache.slice(0, 120) || "محتوى هذا المستند التعليمي";
      box.innerHTML += `<div style="background:#fff;padding:6px 10px;border-radius:8px;align-self:flex-start;">بناءً على المستند: "${esc(snippet)}..."، يمكنك مراجعة هذه النقطة أو توليد اختبار للتدرب عليها.</div>`;
      box.scrollTop = box.scrollHeight;
    }, 500);
  };

  // توليد الاختبار من محرك الأسئلة المشترك
  document.getElementById('internalGenQuizBtn').onclick = () => {
    const questions = generateAccurateQuestions(fullTextCache, 4);
    const container = document.getElementById('internalQuizContainer');
    let idx = 0;

    function showQ() {
      if (idx >= questions.length) {
        container.innerHTML = '<div style="color:#0B5F58;font-weight:700;text-align:center;padding:8px;">انتهى الاختبار بنجاح!</div>';
        return;
      }
      const item = questions[idx];
      container.innerHTML = `
        <div style="font-size:12px;font-weight:700;">${esc(item.q)}</div>
        ${item.options.map(o => `<button class="q-opt" data-val="${esc(o)}" style="background:#F3F5F9;border:1px solid #D5DBE7;padding:6px;border-radius:6px;text-align:right;font-size:11px;margin-top:4px;">${esc(o)}</button>`).join('')}
        <button id="nxtBtn" class="btn pri hide" style="height:28px;font-size:11px;margin-top:6px;">التالي</button>
      `;
      container.querySelectorAll('.q-opt').forEach(b => {
        b.onclick = () => {
          b.style.background = b.dataset.val === item.answer ? '#E4F2F0' : '#FDECEA';
          container.querySelector('#nxtBtn').classList.remove('hide');
        };
      });
      container.querySelector('#nxtBtn').onclick = () => { idx++; showQ(); };
    }
    showQ();
  };

  loadDocument();
</script>
</body>
</html>
