<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><title>التسجيلات الصوتية</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
  <div class="side"></div>
  <div class="main">
    <h1>التسجيلات والتفريغات المحفوظة</h1>
    <div id="recList" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</div>
<script type="module">
  import { initSidebar } from './js/sidebar.js';
  import { storeAction, esc } from './js/db.js';
  initSidebar('recordings');

  const recs = await storeAction('recordings', 'readonly', 'getAll');
  document.getElementById('recList').innerHTML = recs.length ? recs.map(r => `
    <div class="card" style="padding:16px">
      <div style="font-weight:700;color:#0B5F58;margin-bottom:6px">${esc(r.title)} (${esc(r.date)})</div>
      <div style="font-size:14px;line-height:1.6">${esc(r.transcript)}</div>
    </div>
  `).join('') : '<div class="mut">لا توجد تسجيلات محفوظة بعد.</div>';
</script>
</body>
</html>
